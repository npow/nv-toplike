[package]
name = "nv-toplike"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Real-time NVIDIA GPU telemetry and performance monitor in the terminal"
repository = "https://github.com/npow/nv-toplike"
homepage = "https://github.com/npow/nv-toplike"
documentation = "https://github.com/npow/nv-toplike#readme"
readme = "README.md"
keywords = ["nvidia", "gpu", "nvml", "telemetry", "tui"]
categories = ["command-line-utilities", "hardware-support"]
exclude = ["assets/*", "scripts/*", ".github/*"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libloading = "0.8"
nvml-wrapper = "0.13"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-width = "0.2"

[package.metadata.deb]
maintainer = "npow <https://github.com/npow>"
copyright = "2026 npow"
license-file = ["LICENSE", "4"]
extended-description = "Terminal GPU monitor and performance diagnostics for NVIDIA accelerators."
section = "utils"
priority = "optional"
assets = [
    ["target/release/nv-toplike", "usr/bin/nv-toplike", "755"],
    ["README.md", "usr/share/doc/nv-toplike/README.md", "644"],
    ["LICENSE", "usr/share/doc/nv-toplike/LICENSE", "644"],
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
