name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: false
            build_deb: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            use_cross: true
            build_deb: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            use_cross: true
            build_deb: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross & cargo-deb
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cargo install cross --git https://github.com/cross-rs/cross
          fi
          if [ "${{ matrix.build_deb }}" = "true" ]; then
            cargo install cargo-deb
          fi

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin nv-toplike
          else
            cargo build --release --target ${{ matrix.target }} --bin nv-toplike
          fi

      - name: Build Debian package (.deb)
        if: matrix.build_deb
        run: |
          cargo deb --target ${{ matrix.target }} --no-build -o dist/
          sha256sum dist/*.deb > dist/deb.sha256

      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          STAGING="nv-toplike-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${STAGING}"
          cp "target/${{ matrix.target }}/release/nv-toplike" "${STAGING}/"
          cp README.md LICENSE "${STAGING}/"
          tar -czf "dist/${STAGING}.tar.gz" "${STAGING}"
          sha256sum "dist/${STAGING}.tar.gz" > "dist/${STAGING}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  publish-github:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/deb.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-crates-io:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate with crates.io (OIDC Trusted Publishing)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true

      - name: Publish crate to crates.io
        if: steps.crates-io-auth.outcome == 'success'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
